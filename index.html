
<title>Libreta de Gastos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%BE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    color-scheme: light;
    --paper:        #f1eee2;
    --paper-2:      #e9e5d5;
    --surface:      #fbfaf4;
    --ink:          #232722;
    --ink-soft:     #5b5f54;
    --muted:        #8b8c7e;
    --hairline:     #dedbc9;
    --hairline-2:   #cfccb9;
    --accent:       #234d3e;
    --accent-ink:   #f2f6f2;
    --accent-soft:  #dce7de;
    --good:         #0ca30c;
    --good-ink:     #0a5e0a;
    --warn:         #b8842a;
    --warn-ink:     #7a5717;
    --danger:       #d03b3b;
    --danger-ink:   #8f2323;
    --shadow:       rgba(35,39,34,0.10);
    --cat-1: #2a78d6; --cat-2: #eb6834; --cat-3: #1baf7a; --cat-4: #c98500;
    --cat-5: #d55181; --cat-6: #008300; --cat-7: #4a3aa7; --cat-8: #e34948;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --paper:        #171911;
      --paper-2:      #1f2117;
      --surface:      #1f2216;
      --ink:          #ece8da;
      --ink-soft:     #bdbba9;
      --muted:        #8c8b7c;
      --hairline:     #34362a;
      --hairline-2:   #40422f;
      --accent:       #7ec3a6;
      --accent-ink:   #10241b;
      --accent-soft:  #24352c;
      --good:         #0ca30c;
      --good-ink:     #7ee07e;
      --warn:         #fab219;
      --warn-ink:     #f0c66a;
      --danger:       #e66767;
      --danger-ink:   #f4a3a3;
      --shadow:       rgba(0,0,0,0.35);
      --cat-1: #3987e5; --cat-2: #d95926; --cat-3: #199e70; --cat-4: #c98500;
      --cat-5: #d55181; --cat-6: #2fae2f; --cat-7: #9085e9; --cat-8: #e66767;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --paper:        #171911;
    --paper-2:      #1f2117;
    --surface:      #1f2216;
    --ink:          #ece8da;
    --ink-soft:     #bdbba9;
    --muted:        #8c8b7c;
    --hairline:     #34362a;
    --hairline-2:   #40422f;
    --accent:       #7ec3a6;
    --accent-ink:   #10241b;
    --accent-soft:  #24352c;
    --good:         #0ca30c;
    --good-ink:     #7ee07e;
    --warn:         #fab219;
    --warn-ink:     #f0c66a;
    --danger:       #e66767;
    --danger-ink:   #f4a3a3;
    --shadow:       rgba(0,0,0,0.35);
    --cat-1: #3987e5; --cat-2: #d95926; --cat-3: #199e70; --cat-4: #c98500;
    --cat-5: #d55181; --cat-6: #2fae2f; --cat-7: #9085e9; --cat-8: #e66767;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"IBM Plex Sans", system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .num{ font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  .page{ max-width:640px; margin:0 auto; padding:20px 16px 96px; }

  .eyebrow{
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted); font-weight:600; margin:0 0 6px;
  }

  header.top{ margin-bottom:18px; }

  .month-row{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin-bottom:4px;
  }
  .month-nav-btn{
    width:36px; height:36px; border-radius:999px; border:1px solid var(--hairline-2);
    background:var(--surface); color:var(--ink); font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex:none;
    transition: background .15s ease, transform .1s ease;
  }
  .month-nav-btn:hover{ background:var(--accent-soft); }
  .month-nav-btn:active{ transform: scale(.94); }
  .month-title{
    font-family:"Fraunces", serif; font-weight:600; font-size:26px;
    text-align:center; min-width:0; text-wrap:balance;
    text-transform:capitalize;
  }

  .sync-row{
    text-align:center; font-size:12px; color:var(--muted); min-height:16px;
  }
  .sync-row.err{ color:var(--danger-ink); }
  .sync-dot{ display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:5px; background:var(--good); position:relative; top:-1px; }
  .sync-dot.saving{ background:var(--warn); }
  .sync-dot.err{ background:var(--danger); }

  .tiles{
    display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:18px 0 16px;
  }
  .tile{
    background:var(--surface); border:1px solid var(--hairline);
    border-radius:12px; padding:12px 10px; text-align:left;
    border-left:3px solid var(--hairline-2);
  }
  .tile.t-income{ border-left-color:var(--good); }
  .tile.t-expense{ border-left-color:var(--danger); }
  .tile.t-balance{ border-left-color:var(--accent); }
  .tile-label{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:600; margin-bottom:4px; }
  .tile-value{ font-size:17px; font-weight:600; }
  .tile-value.negative{ color:var(--danger-ink); }

  .actions-row{
    display:flex; gap:10px; margin:0 0 16px;
  }
  .btn{
    font-family:inherit; font-size:14px; font-weight:600; cursor:pointer;
    border-radius:10px; padding:11px 14px; border:1px solid transparent;
    display:flex; align-items:center; justify-content:center; gap:6px;
    transition: filter .15s ease, transform .1s ease;
  }
  .btn:active{ transform: scale(.98); }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); flex:1; }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-outline{ background:var(--surface); color:var(--ink); border-color:var(--hairline-2); flex:1; }
  .btn-outline:hover{ background:var(--accent-soft); }
  .btn-text{ background:transparent; color:var(--danger-ink); padding:11px 8px; }
  .btn-text:hover{ text-decoration:underline; }
  .btn[disabled]{ opacity:.5; cursor:not-allowed; }

  .tabs{
    display:flex; gap:4px; background:var(--surface); border:1px solid var(--hairline);
    border-radius:12px; padding:4px; margin-bottom:18px;
  }
  .tab-btn{
    flex:1; border:none; background:transparent; font-family:inherit; font-size:13.5px;
    font-weight:600; color:var(--ink-soft); padding:10px 10px; border-radius:9px;
    cursor:pointer; transition: background .15s ease, color .15s ease;
  }
  .tab-btn.active{ background:var(--accent); color:var(--accent-ink); }
  .tab-btn:hover:not(.active){ background:var(--accent-soft); }

  .section-label{
    font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted);
    font-weight:600; margin:0 0 4px 2px; display:flex; justify-content:space-between;
  }
  .stat-line{ font-size:12.5px; color:var(--ink-soft); margin:0 0 10px 2px; }

  .ledger{
    background:var(--surface); border:1px solid var(--hairline); border-radius:14px;
    overflow:hidden;
  }
  .row{
    display:flex; flex-direction:column; gap:6px; padding:13px 14px;
    border-bottom:1px solid var(--hairline); cursor:pointer; background:var(--surface);
    transition: background .12s ease;
  }
  .row:last-child{ border-bottom:none; }
  .row:hover{ background:var(--accent-soft); }
  .row.overdue{ background: color-mix(in srgb, var(--danger) 8%, var(--surface)); }
  .cat-dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .row-top{ display:flex; align-items:baseline; gap:10px; }
  .row-bottom{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .row-concepto{ flex:1; min-width:0; font-size:14.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row-cat{ display:flex; align-items:center; gap:6px; min-width:0; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row-amount{ font-size:15px; font-weight:600; text-align:right; flex:none; }
  .status-pill{
    font-size:11px; font-weight:600; padding:4px 9px; border-radius:999px;
    flex:none; display:flex; align-items:center; gap:4px; white-space:nowrap;
    border:1px solid transparent;
  }
  .status-pill.paid{ background: color-mix(in srgb, var(--good) 16%, transparent); color:var(--good-ink); }
  .status-pill.pending{ background: color-mix(in srgb, var(--warn) 18%, transparent); color:var(--warn-ink); }
  .status-pill.overdue{ background: color-mix(in srgb, var(--danger) 18%, transparent); color:var(--danger-ink); }

  .empty{
    text-align:center; padding:44px 20px; background:var(--surface);
    border:1px dashed var(--hairline-2); border-radius:14px; color:var(--ink-soft);
  }
  .empty svg{ margin-bottom:10px; opacity:.7; }
  .empty p{ font-size:14px; margin:0 0 16px; }
  .empty .btn{ display:inline-flex; }

  .fab{
    position:fixed; right:20px; bottom:22px; width:56px; height:56px; border-radius:50%;
    background:var(--accent); color:var(--accent-ink); border:none; font-size:26px;
    box-shadow:0 8px 20px var(--shadow); cursor:pointer; display:flex; align-items:center;
    justify-content:center; z-index:20; line-height:1;
  }
  .fab:active{ transform:scale(.95); }

  .overlay{
    position:fixed; inset:0; background:rgba(20,22,16,.42); z-index:30;
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .18s ease;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  @media (min-width:560px){ .overlay{ align-items:center; } }

  .sheet{
    background:var(--paper); width:100%; max-width:480px; border-radius:18px 18px 0 0;
    padding:20px 18px 22px; box-shadow:0 -8px 30px var(--shadow);
    transform:translateY(16px); transition:transform .18s ease;
    max-height:88vh; overflow-y:auto;
  }
  .overlay.show .sheet{ transform:translateY(0); }
  @media (min-width:560px){ .sheet{ border-radius:18px; } }

  .sheet h2{ font-family:"Fraunces", serif; font-size:21px; margin:0 0 16px; font-weight:600; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; }
  .field input[type="text"], .field input[type="number"]{
    width:100%; font-family:inherit; font-size:15px; padding:11px 12px;
    border:1px solid var(--hairline-2); border-radius:9px; background:var(--surface); color:var(--ink);
  }
  .field input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .amount-field{ position:relative; }
  .amount-field span{ position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted); font-family:"IBM Plex Mono",monospace; pointer-events:none; }
  .field .amount-field input[type="number"]{ padding-left:27px; font-family:"IBM Plex Mono",monospace; }
  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  .chip-grid{ display:flex; flex-wrap:wrap; gap:7px; }
  .chip{
    display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600;
    padding:7px 11px; border-radius:999px; border:1.5px solid var(--hairline-2);
    background:var(--surface); color:var(--ink-soft); cursor:pointer;
  }
  .chip .cat-dot{ width:8px; height:8px; }
  .chip.active{ border-color:var(--accent); color:var(--ink); background:var(--accent-soft); }

  .toggle-row{ display:flex; align-items:center; justify-content:space-between; padding:6px 2px; }
  .toggle-row > span{ font-size:14px; font-weight:600; color:var(--ink); }
  .switch{ position:relative; width:44px; height:26px; flex:none; cursor:pointer; }
  .switch input{ opacity:0; width:0; height:0; }
  .switch .track{ position:absolute; inset:0; background:var(--hairline-2); border-radius:999px; transition:background .15s ease; cursor:pointer; }
  .switch .thumb{ position:absolute; width:20px; height:20px; left:3px; top:3px; background:var(--surface); border-radius:50%; transition:transform .15s ease; box-shadow:0 1px 3px var(--shadow); }
  .switch input:checked + .track{ background:var(--good); }
  .switch input:checked + .track .thumb{ transform:translateX(18px); }

  .sheet-actions{ display:flex; gap:10px; margin-top:18px; }
  .sheet-actions .btn-primary{ flex:2; }
  .sheet-actions .btn-outline{ flex:1; }

  .confirm-body{ font-size:14px; color:var(--ink-soft); line-height:1.5; margin-bottom:18px; }
  .confirm-body b{ color:var(--ink); }

  ::selection{ background:var(--accent-soft); }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>

<div class="page" id="app">
  <header class="top">
    <p class="eyebrow" style="text-align:center">Libreta de Gastos</p>
    <div class="month-row">
      <button class="month-nav-btn" id="prevMonthBtn" aria-label="Mes anterior">‹</button>
      <h1 class="month-title" id="monthTitle">—</h1>
      <button class="month-nav-btn" id="nextMonthBtn" aria-label="Mes siguiente">›</button>
    </div>
    <div class="sync-row" id="syncRow"><span class="sync-dot" id="syncDot"></span><span id="syncText">Cargando…</span></div>
  </header>

  <div class="tiles">
    <div class="tile t-income"><div class="tile-label">Ingresos</div><div class="tile-value num" id="tileIngresos">$0</div></div>
    <div class="tile t-expense"><div class="tile-label">Gastos</div><div class="tile-value num" id="tileGastos">$0</div></div>
    <div class="tile t-balance"><div class="tile-label">Saldo</div><div class="tile-value num" id="tileSaldo">$0</div></div>
  </div>

  <div class="actions-row">
    <button class="btn btn-outline" id="copyBtn">⧉ Copiar mes anterior</button>
    <button class="btn btn-primary" id="addBtn">+ Agregar</button>
  </div>

  <div class="tabs" id="tabSwitch">
    <button class="tab-btn active" type="button" data-tab="gastos">Gastos</button>
    <button class="tab-btn" type="button" data-tab="ingresos">Ingresos</button>
  </div>

  <p class="section-label"><span id="sectionTitle">Gastos del mes</span><span id="itemCount"></span></p>
  <p class="stat-line" id="statLine"></p>

  <div id="listArea"></div>
</div>

<button class="fab" id="fabAdd" aria-label="Agregar">+</button>

<div class="overlay" id="editOverlay">
  <form class="sheet" id="editForm">
    <h2 id="editTitle">Nuevo gasto</h2>
    <div class="field">
      <label for="f-concepto">Concepto</label>
      <input type="text" id="f-concepto" placeholder="Ej: Alquiler, Luz, Internet…" required maxlength="60">
    </div>
    <div class="field">
      <label>Categoría</label>
      <div class="chip-grid" id="catChips"></div>
    </div>
    <div class="two-col">
      <div class="field">
        <label for="f-monto">Monto</label>
        <div class="amount-field"><span>$</span><input type="number" id="f-monto" min="0" step="1" inputmode="decimal" placeholder="0" required></div>
      </div>
      <div class="field">
        <label for="f-vencimiento" id="fVencimientoLabel">Vence el día</label>
        <input type="number" id="f-vencimiento" min="1" max="31" placeholder="Opcional">
      </div>
    </div>
    <div class="field toggle-row">
      <span id="fPagadoLabel">Ya lo pagué</span>
      <label class="switch"><input type="checkbox" id="f-pagado"><span class="track"><span class="thumb"></span></span></label>
    </div>
    <div class="sheet-actions">
      <button type="button" class="btn btn-outline" id="cancelBtn">Cancelar</button>
      <button type="submit" class="btn btn-primary">Guardar</button>
    </div>
    <button type="button" class="btn btn-text" id="deleteBtn" style="width:100%; margin-top:8px; display:none;">Eliminar</button>
  </form>
</div>

<div class="overlay" id="confirmOverlay">
  <div class="sheet" id="confirmSheet">
    <h2 id="confirmTitle">Copiar mes anterior</h2>
    <p class="confirm-body" id="confirmBody"></p>
    <div class="sheet-actions" id="confirmActions"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var EXPENSE_CATEGORIES = [
    {id:"servicios",   label:"Servicios",    varName:"--cat-1"},
    {id:"vivienda",    label:"Vivienda",     varName:"--cat-2"},
    {id:"super",       label:"Supermercado", varName:"--cat-3"},
    {id:"transporte",  label:"Transporte",   varName:"--cat-4"},
    {id:"salud",       label:"Salud",        varName:"--cat-5"},
    {id:"tarjeta",     label:"Tarjeta",      varName:"--cat-6"},
    {id:"ocio",        label:"Ocio",         varName:"--cat-7"},
    {id:"otros",       label:"Otros",        varName:"--cat-8"}
  ];
  var INCOME_CATEGORIES = [
    {id:"sueldo",     label:"Sueldo",     varName:"--cat-1"},
    {id:"freelance",  label:"Freelance",  varName:"--cat-2"},
    {id:"alquiler",   label:"Alquiler",   varName:"--cat-3"},
    {id:"reintegro",  label:"Reintegro",  varName:"--cat-4"},
    {id:"otros",      label:"Otros",      varName:"--cat-5"}
  ];

  var MODES = {
    gastos: {
      key:"gastos", singular:"gasto", plural:"gastos",
      categories: EXPENSE_CATEGORIES,
      dueLabel:"Vence el día", doneLabel:"Ya lo pagué",
      doneWord:"Pagado", pendingWord:"Pendiente", overdueWord:"Atrasado",
      addBtn:"+ Agregar gasto", newTitle:"Nuevo gasto", editTitle:"Editar gasto",
      deleteLabel:"Eliminar gasto", sectionLabel:"Gastos del mes",
      emptyText:"Todavía no cargaste gastos para", emptyAdd:"+ Agregar gasto"
    },
    ingresos: {
      key:"ingresos", singular:"ingreso", plural:"ingresos",
      categories: INCOME_CATEGORIES,
      dueLabel:"Cobra el día", doneLabel:"Ya lo cobré",
      doneWord:"Cobrado", pendingWord:"Pendiente", overdueWord:"Atrasado",
      addBtn:"+ Agregar ingreso", newTitle:"Nuevo ingreso", editTitle:"Editar ingreso",
      deleteLabel:"Eliminar ingreso", sectionLabel:"Ingresos del mes",
      emptyText:"Todavía no cargaste ingresos para", emptyAdd:"+ Agregar ingreso"
    }
  };

  function catById(mode, id){
    var list = mode.categories;
    for (var i=0;i<list.length;i++){ if (list[i].id===id) return list[i]; }
    return list[list.length-1];
  }

  var MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

  function pad2(n){ return (n<10?"0":"")+n; }
  function todayParts(){
    var d = new Date();
    return { y:d.getFullYear(), m:d.getMonth()+1, day:d.getDate() };
  }
  function monthId(y,m){ return y+"-"+pad2(m); }
  function shiftMonth(y,m,delta){
    var idx = (y*12 + (m-1)) + delta;
    var ny = Math.floor(idx/12);
    var nm = idx%12 + 1;
    return {y:ny, m:nm};
  }
  function monthLabel(y,m){
    return MESES[m-1] + " " + y;
  }
  function fmtMoney(n){
    n = Number(n)||0;
    var neg = n<0; n = Math.abs(n);
    var rounded = Math.round(n);
    var s = String(rounded).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    return (neg?"-":"") + "$" + s;
  }
  function uid(){
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
  }

  // ---------- Supabase config ----------
  var SUPABASE_URL = "https://ibmxclzjqqyhprmbvyqc.supabase.co";
  var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlibXhjbHpqcXF5aHBybWJ2eXFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMDA0MzcsImV4cCI6MjEwNDY3NjQzN30.V-lAORkX9mHB8CHLPipO2TFf_NfX0yeB2IeWVBpCa2E";
  var TABLE = "libreta_gastos_meses";
  var POLL_MS = 20000;

  function sbHeaders(extra){
    var h = { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY, "Content-Type": "application/json" };
    if (extra) for (var k in extra) h[k] = extra[k];
    return h;
  }
  // select=* so this keeps working whether the row still has the legacy
  // "items" column or the current "gastos"/"ingresos" columns.
  function fetchMonthRow(id){
    return fetch(SUPABASE_URL + "/rest/v1/" + TABLE + "?id=eq." + encodeURIComponent(id) + "&select=*", { headers: sbHeaders() })
      .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function(rows){
        var row = rows && rows[0] ? rows[0] : null;
        if (!row) return { gastos: [], ingresos: [] };
        var gastos = Array.isArray(row.gastos) ? row.gastos : (Array.isArray(row.items) ? row.items : []);
        var ingresos = Array.isArray(row.ingresos) ? row.ingresos : [];
        return { gastos: gastos, ingresos: ingresos };
      });
  }
  function upsertMonthRow(id, gastos, ingresos){
    return fetch(SUPABASE_URL + "/rest/v1/" + TABLE, {
      method: "POST",
      headers: sbHeaders({ Prefer: "resolution=merge-duplicates,return=minimal" }),
      body: JSON.stringify([{ id: id, gastos: gastos, ingresos: ingresos, updated_at: new Date().toISOString() }])
    }).then(function(r){
      if (!r.ok) return r.text().then(function(t){ throw new Error("HTTP " + r.status + ": " + t); });
    });
  }

  var today = todayParts();
  var state = {
    y: today.y, m: today.m,
    gastos: [], ingresos: [],
    loaded: false,
    activeTab: "gastos",
    editingId: null,
    editingTab: "gastos",
    pollTimer: null
  };

  function activeMode(){ return MODES[state.activeTab]; }
  function activeItems(){ return state[state.activeTab]; }
  function setActiveItems(items){ state[state.activeTab] = items; }

  // ---------- DOM refs ----------
  var el = {
    monthTitle: document.getElementById("monthTitle"),
    prevBtn: document.getElementById("prevMonthBtn"),
    nextBtn: document.getElementById("nextMonthBtn"),
    syncDot: document.getElementById("syncDot"),
    syncText: document.getElementById("syncText"),
    syncRow: document.getElementById("syncRow"),
    copyBtn: document.getElementById("copyBtn"),
    addBtn: document.getElementById("addBtn"),
    fabAdd: document.getElementById("fabAdd"),
    tileIngresos: document.getElementById("tileIngresos"),
    tileGastos: document.getElementById("tileGastos"),
    tileSaldo: document.getElementById("tileSaldo"),
    tabSwitch: document.getElementById("tabSwitch"),
    sectionTitle: document.getElementById("sectionTitle"),
    statLine: document.getElementById("statLine"),
    itemCount: document.getElementById("itemCount"),
    listArea: document.getElementById("listArea"),
    editOverlay: document.getElementById("editOverlay"),
    editForm: document.getElementById("editForm"),
    editTitle: document.getElementById("editTitle"),
    catChips: document.getElementById("catChips"),
    fConcepto: document.getElementById("f-concepto"),
    fMonto: document.getElementById("f-monto"),
    fVencimiento: document.getElementById("f-vencimiento"),
    fVencimientoLabel: document.getElementById("fVencimientoLabel"),
    fPagado: document.getElementById("f-pagado"),
    fPagadoLabel: document.getElementById("fPagadoLabel"),
    cancelBtn: document.getElementById("cancelBtn"),
    deleteBtn: document.getElementById("deleteBtn"),
    confirmOverlay: document.getElementById("confirmOverlay"),
    confirmTitle: document.getElementById("confirmTitle"),
    confirmBody: document.getElementById("confirmBody"),
    confirmActions: document.getElementById("confirmActions")
  };

  var selectedCat = EXPENSE_CATEGORIES[0].id;

  // ---------- tabs ----------
  Array.prototype.forEach.call(el.tabSwitch.children, function(btn){
    btn.addEventListener("click", function(){
      var tab = btn.dataset.tab;
      if (tab === state.activeTab) return;
      state.activeTab = tab;
      Array.prototype.forEach.call(el.tabSwitch.children, function(b){
        b.classList.toggle("active", b.dataset.tab === tab);
      });
      renderList();
    });
  });

  // ---------- chips (rebuilt per mode) ----------
  function renderChips(mode){
    el.catChips.innerHTML = "";
    mode.categories.forEach(function(c){
      var chip = document.createElement("div");
      chip.className = "chip";
      chip.dataset.cat = c.id;
      chip.innerHTML = '<span class="cat-dot" style="background:var('+c.varName+')"></span>' + c.label;
      chip.addEventListener("click", function(){
        selectedCat = c.id;
        renderChipsActive();
      });
      el.catChips.appendChild(chip);
    });
  }
  function renderChipsActive(){
    Array.prototype.forEach.call(el.catChips.children, function(chip){
      chip.classList.toggle("active", chip.dataset.cat === selectedCat);
    });
  }

  // ---------- month nav ----------
  function currentMonthId(){ return monthId(state.y, state.m); }
  function isRealCurrentMonth(){ return state.y===today.y && state.m===today.m; }

  function goToMonth(y,m){
    state.y = y; state.m = m;
    state.loaded = false;
    state.gastos = []; state.ingresos = [];
    renderMonthHeader();
    renderList();
    loadMonth();
  }
  el.prevBtn.addEventListener("click", function(){
    var p = shiftMonth(state.y, state.m, -1); goToMonth(p.y,p.m);
  });
  el.nextBtn.addEventListener("click", function(){
    var n = shiftMonth(state.y, state.m, 1); goToMonth(n.y,n.m);
  });

  function renderMonthHeader(){
    el.monthTitle.textContent = monthLabel(state.y, state.m);
  }

  // ---------- sync indicator ----------
  function setSync(kind, text){
    el.syncDot.className = "sync-dot" + (kind==="saving"?" saving":kind==="err"?" err":"");
    el.syncRow.className = "sync-row" + (kind==="err"?" err":"");
    el.syncText.textContent = text;
  }

  // ---------- summary (always visible, both tabs combined) ----------
  function sumMonto(list){
    return list.reduce(function(acc,it){ return acc + (Number(it.monto)||0); }, 0);
  }
  function renderSummary(){
    var totalIngresos = sumMonto(state.ingresos);
    var totalGastos = sumMonto(state.gastos);
    var saldo = totalIngresos - totalGastos;
    el.tileIngresos.textContent = fmtMoney(totalIngresos);
    el.tileGastos.textContent = fmtMoney(totalGastos);
    el.tileSaldo.textContent = fmtMoney(saldo);
    el.tileSaldo.classList.toggle("negative", saldo < 0);
  }

  // ---------- per-tab stat line ----------
  function renderStatLine(){
    var mode = activeMode();
    var items = activeItems();
    var done = 0, pending = 0;
    items.forEach(function(it){
      var amt = Number(it.monto)||0;
      if (it.pagado) done += amt; else pending += amt;
    });
    el.sectionTitle.textContent = mode.sectionLabel;
    el.itemCount.textContent = items.length ? (items.length + " " + (items.length===1?mode.singular:mode.plural)) : "";
    el.statLine.textContent = items.length ? (mode.doneWord + " " + fmtMoney(done) + " · " + mode.pendingWord + " " + fmtMoney(pending)) : "";
  }

  // ---------- list ----------
  function sortedItems(items){
    return items.slice().sort(function(a,b){
      var av = a.vencimiento==null ? 999 : a.vencimiento;
      var bv = b.vencimiento==null ? 999 : b.vencimiento;
      if (av!==bv) return av-bv;
      return (a.concepto||"").localeCompare(b.concepto||"");
    });
  }

  function isOverdue(it){
    return isRealCurrentMonth() && !it.pagado && it.vencimiento!=null && it.vencimiento < today.day;
  }

  function renderList(){
    var mode = activeMode();
    var items = activeItems();
    renderSummary();
    renderStatLine();

    if (!state.loaded){
      el.listArea.innerHTML = '<div class="empty"><p>Cargando…</p></div>';
      return;
    }
    if (items.length === 0){
      el.listArea.innerHTML =
        '<div class="empty">' +
        '<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">' +
        '<rect x="7" y="4" width="26" height="32" rx="3" stroke="var(--ink-soft)" stroke-width="2"/>' +
        '<line x1="13" y1="14" x2="27" y2="14" stroke="var(--ink-soft)" stroke-width="2" stroke-linecap="round"/>' +
        '<line x1="13" y1="20" x2="27" y2="20" stroke="var(--ink-soft)" stroke-width="2" stroke-linecap="round"/>' +
        '<line x1="13" y1="26" x2="21" y2="26" stroke="var(--ink-soft)" stroke-width="2" stroke-linecap="round"/>' +
        '</svg>' +
        '<p>' + mode.emptyText + ' ' + monthLabel(state.y,state.m) + '.</p>' +
        '<button class="btn btn-outline" id="emptyCopyBtn" style="margin-right:8px;">Copiar mes anterior</button>' +
        '<button class="btn btn-primary" id="emptyAddBtn">' + mode.emptyAdd + '</button>' +
        '</div>';
      document.getElementById("emptyCopyBtn").addEventListener("click", onCopyClick);
      document.getElementById("emptyAddBtn").addEventListener("click", function(){ openEdit(null); });
      return;
    }
    var wrap = document.createElement("div");
    wrap.className = "ledger";
    sortedItems(items).forEach(function(it){
      var cat = catById(mode, it.categoria);
      var overdue = isOverdue(it);
      var row = document.createElement("div");
      row.className = "row" + (overdue?" overdue":"");
      row.dataset.id = it.id;

      var sub = [cat.label];
      if (it.vencimiento!=null) sub.push((mode.key==="gastos" ? "vence día " : "cobra día ") + it.vencimiento);

      var top = document.createElement("div");
      top.className = "row-top";
      var concepto = document.createElement("div");
      concepto.className = "row-concepto";
      concepto.textContent = it.concepto || "(sin nombre)";
      var amount = document.createElement("div");
      amount.className = "row-amount num";
      amount.textContent = fmtMoney(it.monto);
      top.appendChild(concepto);
      top.appendChild(amount);

      var bottom = document.createElement("div");
      bottom.className = "row-bottom";
      var catWrap = document.createElement("div");
      catWrap.className = "row-cat";
      var dot = document.createElement("span");
      dot.className = "cat-dot";
      dot.style.background = "var(" + cat.varName + ")";
      var catText = document.createElement("span");
      catText.textContent = sub.join(" · ");
      catWrap.appendChild(dot);
      catWrap.appendChild(catText);

      var pill = document.createElement("span");
      pill.className = "status-pill " + (it.pagado ? "paid" : (overdue ? "overdue" : "pending"));
      pill.textContent = it.pagado ? ("✓ " + mode.doneWord) : (overdue ? ("⚠ " + mode.overdueWord) : ("⏳ " + mode.pendingWord));
      pill.title = "Tocar para marcar " + (it.pagado ? mode.pendingWord.toLowerCase() : mode.doneWord.toLowerCase());
      pill.addEventListener("click", function(ev){
        ev.stopPropagation();
        toggleDone(it.id);
      });

      bottom.appendChild(catWrap);
      bottom.appendChild(pill);

      row.appendChild(top);
      row.appendChild(bottom);
      row.addEventListener("click", function(){ openEdit(it.id); });

      wrap.appendChild(row);
    });
    el.listArea.innerHTML = "";
    el.listArea.appendChild(wrap);
  }

  // ---------- persistence (Supabase) ----------
  // Every write re-fetches the row right before saving and re-applies the
  // same change to that fresh copy. Two devices can have this page open at
  // once; without this, whichever device saves last with its own
  // (possibly stale) local list would silently wipe out what the other
  // device had just added.
  function identity(x){ return x; }

  function persistBoth(mutateGastos, mutateIngresos, cb){
    // optimistic local update for instant feedback
    state.gastos = mutateGastos(state.gastos);
    state.ingresos = mutateIngresos(state.ingresos);
    renderList();

    var idAtCall = currentMonthId();
    setSync("saving", "Guardando…");
    fetchMonthRow(idAtCall).then(function(fresh){
      if (idAtCall !== currentMonthId()) return; // navigated away meanwhile
      var newGastos = mutateGastos(fresh.gastos);
      var newIngresos = mutateIngresos(fresh.ingresos);
      return upsertMonthRow(idAtCall, newGastos, newIngresos).then(function(){
        if (idAtCall !== currentMonthId()) return;
        state.gastos = newGastos;
        state.ingresos = newIngresos;
        setSync("ok", "Sincronizado");
        renderList();
        if (cb) cb(null);
      });
    }).catch(function(e){
      if (idAtCall === currentMonthId()) setSync("err", "No se pudo guardar. Probá de nuevo.");
      if (cb) cb(e);
    });
  }

  function persistMutation(tab, mutateFn, cb){
    if (tab === "gastos") persistBoth(mutateFn, identity, cb);
    else persistBoth(identity, mutateFn, cb);
  }

  function loadMonth(silent){
    var idAtCall = currentMonthId();
    if (!silent) setSync("saving", "Cargando…");
    return fetchMonthRow(idAtCall).then(function(data){
      if (idAtCall !== currentMonthId()) return; // user moved to another month meanwhile
      state.gastos = data.gastos;
      state.ingresos = data.ingresos;
      state.loaded = true;
      setSync("ok", "Sincronizado");
      renderList();
    }).catch(function(err){
      if (idAtCall !== currentMonthId()) return;
      state.loaded = true;
      setSync("err", "No se pudo conectar. Revisá tu conexión.");
      renderList();
    });
  }

  function startPolling(){
    stopPolling();
    state.pollTimer = setInterval(function(){ loadMonth(true); }, POLL_MS);
  }
  function stopPolling(){
    if (state.pollTimer){ clearInterval(state.pollTimer); state.pollTimer = null; }
  }
  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState === "visible") loadMonth(true);
  });
  window.addEventListener("focus", function(){ loadMonth(true); });
  window.addEventListener("online", function(){ loadMonth(true); });

  // ---------- edit sheet ----------
  function openEdit(id){
    var mode = activeMode();
    state.editingTab = state.activeTab;
    state.editingId = id;
    renderChips(mode);
    el.fVencimientoLabel.textContent = mode.dueLabel;
    el.fPagadoLabel.textContent = mode.doneLabel;
    el.deleteBtn.textContent = mode.deleteLabel;

    if (id){
      var it = activeItems().filter(function(x){return x.id===id;})[0];
      if (!it) return;
      el.editTitle.textContent = mode.editTitle;
      el.fConcepto.value = it.concepto || "";
      el.fMonto.value = it.monto != null ? it.monto : "";
      el.fVencimiento.value = it.vencimiento != null ? it.vencimiento : "";
      el.fPagado.checked = !!it.pagado;
      selectedCat = it.categoria || mode.categories[0].id;
      el.deleteBtn.style.display = "block";
    } else {
      el.editTitle.textContent = mode.newTitle;
      el.fConcepto.value = "";
      el.fMonto.value = "";
      el.fVencimiento.value = "";
      el.fPagado.checked = false;
      selectedCat = mode.categories[0].id;
      el.deleteBtn.style.display = "none";
    }
    renderChipsActive();
    el.editOverlay.classList.add("show");
    setTimeout(function(){ el.fConcepto.focus(); }, 50);
  }
  function closeEdit(){
    el.editOverlay.classList.remove("show");
    state.editingId = null;
  }
  el.addBtn.addEventListener("click", function(){ openEdit(null); });
  el.fabAdd.addEventListener("click", function(){ openEdit(null); });
  el.cancelBtn.addEventListener("click", closeEdit);
  el.editOverlay.addEventListener("click", function(e){ if (e.target===el.editOverlay) closeEdit(); });

  el.editForm.addEventListener("submit", function(e){
    e.preventDefault();
    var concepto = el.fConcepto.value.trim();
    var monto = parseFloat(el.fMonto.value);
    if (!concepto || isNaN(monto)) return;
    var venc = el.fVencimiento.value ? Math.max(1, Math.min(31, parseInt(el.fVencimiento.value,10))) : null;
    var pagado = el.fPagado.checked;
    var tab = state.editingTab;
    var editingIdSnapshot = state.editingId;
    var newId = uid();

    closeEdit();
    persistMutation(tab, function(items){
      if (editingIdSnapshot){
        return items.map(function(it){
          if (it.id !== editingIdSnapshot) return it;
          return Object.assign({}, it, { concepto:concepto, categoria:selectedCat, monto:monto, vencimiento:venc, pagado:pagado });
        });
      }
      return items.concat([{ id:newId, concepto:concepto, categoria:selectedCat, monto:monto, vencimiento:venc, pagado:pagado }]);
    });
  });

  el.deleteBtn.addEventListener("click", function(){
    if (!state.editingId) return;
    var tab = state.editingTab;
    var idToDelete = state.editingId;
    closeEdit();
    persistMutation(tab, function(items){
      return items.filter(function(it){ return it.id !== idToDelete; });
    });
  });

  function toggleDone(id){
    persistMutation(state.activeTab, function(items){
      return items.map(function(it){
        return it.id===id ? Object.assign({}, it, {pagado: !it.pagado}) : it;
      });
    });
  }

  // ---------- copy previous month ----------
  function closeConfirm(){ el.confirmOverlay.classList.remove("show"); }
  el.confirmOverlay.addEventListener("click", function(e){ if (e.target===el.confirmOverlay) closeConfirm(); });

  function showConfirm(title, body, actions){
    el.confirmTitle.textContent = title;
    el.confirmBody.innerHTML = body;
    el.confirmActions.innerHTML = "";
    actions.forEach(function(a){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "btn " + (a.style || "btn-outline");
      b.textContent = a.label;
      b.addEventListener("click", function(){ closeConfirm(); a.onClick(); });
      el.confirmActions.appendChild(b);
    });
    el.confirmOverlay.classList.add("show");
  }

  function countLabel(n, singular, plural){
    return n + " " + (n===1 ? singular : plural);
  }

  function onCopyClick(){
    var prev = shiftMonth(state.y, state.m, -1);
    var prevId = monthId(prev.y, prev.m);
    var prevLabel = monthLabel(prev.y, prev.m);
    fetchMonthRow(prevId).then(function(data){
      var prevGastos = data.gastos, prevIngresos = data.ingresos;
      if (prevGastos.length === 0 && prevIngresos.length === 0){
        showConfirm("Copiar mes anterior",
          "No hay nada cargado en <b>" + prevLabel + "</b> para copiar.",
          [{label:"Cerrar", style:"btn-primary", onClick:function(){}}]);
        return;
      }
      function freshCopy(list){
        return list.map(function(it){
          return { id:uid(), concepto:it.concepto, categoria:it.categoria, monto:it.monto, vencimiento:it.vencimiento, pagado:false };
        });
      }
      // generated once so the optimistic update and the merge-write below
      // apply the exact same items (not freshly re-uid()'d each time)
      var gastosCopy = freshCopy(prevGastos);
      var ingresosCopy = freshCopy(prevIngresos);

      var parts = [];
      if (prevGastos.length) parts.push(countLabel(prevGastos.length, "gasto", "gastos"));
      if (prevIngresos.length) parts.push(countLabel(prevIngresos.length, "ingreso", "ingresos"));
      var prevCounts = parts.join(" y ");

      var hasCurrent = state.gastos.length > 0 || state.ingresos.length > 0;
      if (!hasCurrent){
        showConfirm("Copiar mes anterior",
          "Vas a copiar " + prevCounts + " de <b>" + prevLabel + "</b>. Los montos y fechas quedan iguales; el estado vuelve a pendiente para que los marques de nuevo.",
          [
            {label:"Cancelar", style:"btn-outline", onClick:function(){}},
            {label:"Copiar", style:"btn-primary", onClick:function(){
              persistBoth(function(){ return gastosCopy; }, function(){ return ingresosCopy; });
            }}
          ]);
      } else {
        var currentParts = [];
        if (state.gastos.length) currentParts.push(countLabel(state.gastos.length, "gasto", "gastos"));
        if (state.ingresos.length) currentParts.push(countLabel(state.ingresos.length, "ingreso", "ingresos"));
        showConfirm("Copiar mes anterior",
          "En " + monthLabel(state.y,state.m) + " ya tenés cargado: " + currentParts.join(" y ") + ". En <b>" + prevLabel + "</b> hay " + prevCounts + " para copiar. ¿Qué querés hacer?",
          [
            {label:"Cancelar", style:"btn-outline", onClick:function(){}},
            {label:"Agregar", style:"btn-outline", onClick:function(){
              persistBoth(function(items){ return items.concat(gastosCopy); }, function(items){ return items.concat(ingresosCopy); });
            }},
            {label:"Reemplazar todo", style:"btn-primary", onClick:function(){
              persistBoth(function(){ return gastosCopy; }, function(){ return ingresosCopy; });
            }}
          ]);
      }
    }).catch(function(){
      setSync("err","No se pudo leer el mes anterior.");
    });
  }
  el.copyBtn.addEventListener("click", onCopyClick);

  // ---------- boot ----------
  renderMonthHeader();
  renderChips(activeMode());
  renderList();
  loadMonth();
  startPolling();
})();
</script>
